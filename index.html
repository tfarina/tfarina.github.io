---
layout: default
---

<div class="home">

  <p class="text-gray-700 leading-relaxed">
    Exploring open-source tools, Linux tweaks, and practical tech insights — simplified.
  </p>

  <h1 class="page-heading">Posts</h1>

  <div class="mt-8 space-y-8">
    {% for post in site.posts limit:5 %}
    <article class="bg-white p-6 rounded-2xl shadow-md">
      <h3 class="text-xl font-bold text-[#00ffcc] mb-1">
	<a href="{{ post.url | relative_url }}" class="hover:underline">{{ post.title }}</a>
      </h3>
      <p class="text-sm text-gray-500 mb-3">{{ post.date | date: "%B %d, %Y" }}</p>
      <p class="text-gray-700">{{ post.excerpt | strip_html | truncate: 160 }}</p>
      <a href="{{ post.url | relative_url }}" class="text-[#ff00ff] hover:underline mt-2 inline-block">Read more →</a>
    </article>
    {% endfor %}
  </div>

</div>
