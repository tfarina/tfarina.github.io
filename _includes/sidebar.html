<aside class="md:w-1/4 p-4 bg-white border-l border-gray-200">
  <div class="overflow-hidden">
    <!-- header: black rectangle -->
    <div class="bg-black text-white px-3 py-2">
      <h3 class="text-sm font-semibold">Recent Posts</h3>
    </div>

    <!-- body (no border, same bg as page) -->
    <div class="p-4 bg-gray-50 text-gray-800">
      <ul class="space-y-2 text-sm">
	{% for post in site.posts limit:5 %}
	<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
	{% endfor %}
      </ul>
    </div>
  </div>
  <!-- Social Media box -->
  <div class="overflow-hidden mt-6">
    <!-- header: black rectangle -->
    <div class="bg-black text-white px-3 py-2">
      <h3 class="text-sm font-semibold">Follow Me</h3>
    </div>

    <!-- body -->
    <div class="p-4 bg-gray-50 text-gray-800">
      <div class="flex items-center justify-center space-x-3">

	<!-- Example icon circle -->
	<a href="https://instagram.com/yourprofile"
	   class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-300 hover:bg-gray-200 transition">
	  <span class="sr-only">Instagram</span>
	  <!-- Replace with real SVG icon -->
	  <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
	    <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-.75a1.25 1.25 0 11-2.5 0 1.25 1.25 0 012.5 0z"/>
	  </svg>
	</a>

	<!-- Twitter/X -->
	<a href="https://twitter.com/yourprofile"
	   class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-300 hover:bg-gray-200 transition">
	  <span class="sr-only">Twitter</span>
	  <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
	    <path d="M22 4.01c-.77.35-1.6.59-2.46.69a4.3 4.3 0 001.88-2.37 8.58 8.58 0 01-2.72 1.04A4.28 4.28 0 0015.5 3c-2.39 0-4.32 1.93-4.32 4.31 0 .34.04.68.11 1A12.16 12.16 0 013 4.84a4.3 4.3 0 001.33 5.75 4.21 4.21 0 01-1.96-.54v.05c0 2.1 1.5 3.85 3.49 4.25a4.3 4.3 0 01-1.95.07 4.3 4.3 0 004.01 2.98A8.6 8.6 0 012 19.54a12.12 12.12 0 006.56 1.92c7.87 0 12.18-6.52 12.18-12.17 0-.19-.01-.38-.02-.57A8.55 8.55 0 0022 4z"/>
	  </svg>
	</a>

	<!-- GitHub -->
	<a href="https://github.com/yourprofile"
	   class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-300 hover:bg-gray-200 transition">
	  <span class="sr-only">GitHub</span>
	  <svg class="w-5 h-5 text-gray-700" viewBox="0 0 24 24" fill="currentColor">
	    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.29 9.42 7.86 10.95.58.1.79-.25.79-.56v-1.98c-3.2.7-3.88-1.38-3.88-1.38-.53-1.34-1.3-1.7-1.3-1.7-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.72 0-1.26.45-2.29 1.2-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.03 11.03 0 015.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.12 3.05.75.8 1.2 1.83 1.2 3.09 0 4.45-2.68 5.42-5.24 5.7.42.36.79 1.09.79 2.2v3.27c0 .31.21.67.8.56A10.97 10.97 0 0023.5 12c0-6.35-5.15-11.5-11.5-11.5z"/>
	  </svg>
	</a>
      </div>
    </div>
  </div>
</aside>
