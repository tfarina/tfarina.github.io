<aside class="md:w-1/4 p-4 bg-white border-l border-gray-200">
  <div class="overflow-hidden">
    <!-- header: black rectangle -->
    <div class="bg-black text-white px-3 py-2">
      <h3 class="text-sm font-semibold">Recent Posts</h3>
    </div>

    <!-- body (no border, same bg as page) -->
    <div class="p-4 bg-gray-50 text-gray-800">
      <ul class="space-y-2 text-sm">
	{% for post in site.posts limit:5 %}
	<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
	{% endfor %}
      </ul>
    </div>
  </div>
</aside>
